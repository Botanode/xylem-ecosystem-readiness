# Shared ownership registry. VERIFY OWNERSHIP BEFORE ANY SHARED-FILE EDIT.
registry_version: 1
updated: "2026-11-25"
integration_namespace: integration/ecosystem-readiness
compact_rule: "If a file is not in an agent's allowed_write_paths, do not modify it."

schema:
  agent_id: string
  squad: string
  repository: string
  branch: string
  starting_revision: string
  owned_files: [string]
  allowed_write_paths: [string]
  protected_dependencies: [string]
  integration_owner: string
  status: unassigned | in_progress | implemented_pending_verification | verified | blocked

protected_dependencies: &protected
  - native representation / primitive lowering
  - integer machine ops / bitwise / wrapping / numeric constants
  - canonical IR definitions / native ABI / memory layout
  - native vector, map, string implementations
  - ownership lowering / borrow analysis / refcount / COW
  - LLVM lowering & optimization / compiler optimization passes
  - runtime execution architecture
  - benchmark harness & performance certification
  - bootstrap implementation

