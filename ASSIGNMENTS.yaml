# 100 specialist assignments. Division of responsibility, NOT 100 concurrent processes.
# status: unassigned -> dispatched -> implemented_pending_verification -> verified
campaign: ecosystem-readiness
integration_namespace: integration/ecosystem-readiness
task_namespace: task/ecosystem/<slug>
concurrency_cap: "set by host resources; exploration cheap, builds/tests focused & isolated"

squads:
  A: { name: coordination-and-contracts, count: 4 }
  B: { name: language-server,            count: 12 }
  C: { name: formatter,                  count: 8  }
  D: { name: developer-tooling,          count: 12 }
  E: { name: independent-conformance,    count: 16 }
